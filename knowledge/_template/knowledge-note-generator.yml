# Configuración para generate_knowledge_notes.py
#
# - defaults: valores globales por defecto.
# - profiles: apuntes ligados a un perfil/proceso/fuente concreto.
# - shared: apuntes compartidos entre varios procesos o sin proceso específico.

defaults:
  origin: academia
  status: borrador
  ai_generated: false
  ai_cleaned: true
  needs_human_review: true
  template: knowledge/_template/apunte.md
  tags: []
  source_ids: []
  ai_sources: []

profiles:
  age/a1-sti-preparatic:
    process: age
    profile: a1-sti
    source: preparatic
    academy: preparatic
    tags:
      - age
      - a1-sti
      - preparatic

  age/a2-gsi-cetic:
