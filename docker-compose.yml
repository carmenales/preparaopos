services:
  web:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: preparaopos-preparadortai-web
    ports:
      - "8080:80"
    environment:
      DB_SERVER: db
      DB_USERNAME: preparaopos
      DB_PASSWORD: preparaopos
      DB_NAME: preparadortai
    volumes:
      - ./apps/preparadortai:/var/www/html
      - ./apps/shared:/var/www/shared:ro
    depends_on:
      - db

  studyassistant:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: preparaopos-studyassistant-web
    ports:
      - "8090:8080"
    working_dir: /workspace
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./apps/studyassistant:/workspace/apps/studyassistant:ro
      - ./knowledge:/workspace/knowledge:ro
      - ./apps/shared:/workspace/apps/shared:ro
    command: php -S 0.0.0.0:8080 -t /workspace/apps/studyassistant

  db:
    image: mariadb:10.4
    container_name: preparaopos-preparadortai-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: preparadortai
      MARIADB_USER: preparaopos
      MARIADB_PASSWORD: preparaopos
    ports:
      - "3307:3306"
    volumes:
      - preparaopos_preparadortai_db_data:/var/lib/mysql
      - ./db/local:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5
    container_name: preparaopos-preparadortai-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: preparaopos
      PMA_PASSWORD: preparaopos
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  preparaopos_preparadortai_db_data: