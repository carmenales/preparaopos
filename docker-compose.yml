services:
  web:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: preparaopos-preparadortai-web
    ports:
      - "8080:80"
    environment:
      DB_SERVER: db
      DB_USERNAME: preparaopos
      DB_PASSWORD: preparaopos
      DB_NAME: preparadortai
    volumes:
      - ./apps/preparadortai:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: preparaopos-preparadortai-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: preparadortai
      MARIADB_USER: preparaopos
      MARIADB_PASSWORD: preparaopos
    ports:
      - "3307:3306"
    volumes:
      - preparaopos_preparadortai_db_data:/var/lib/mysql
      - ./db/local:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5
    container_name: preparaopos-preparadortai-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: preparaopos
      PMA_PASSWORD: preparaopos
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  preparaopos_preparadortai_db_data: