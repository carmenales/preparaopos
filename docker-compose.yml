services:
  web:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: preparaopos-preparadortai-web
    ports:
      - "8082:80"
    environment:
      DB_SERVER: db
      DB_USERNAME: preparaopos
      DB_PASSWORD: preparaopos
      DB_NAME: preparadortai
    volumes:
      - ./apps/preparadortai:/var/www/html
      - ./apps/shared:/var/www/shared:ro
    depends_on:
      - db

  studyassistant:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: preparaopos-studyassistant-web
    ports:
      - "8090:8080"
    working_dir: /workspace
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./apps/studyassistant:/workspace/apps/studyassistant:ro
      - ./knowledge:/workspace/knowledge:ro
      - ./apps/shared:/workspace/apps/shared:ro
    command: php -S 0.0.0.0:8080 -t /workspace/apps/studyassistant

  embeddings:
    build:
      context: .
      dockerfile: infra/docker/embeddings/Dockerfile
    container_name: preparaopos-embeddings
    ports:
      - "8091:8000"
    volumes:
      - ./services/embeddings:/workspace/services/embeddings:ro
      - ./scripts:/workspace/scripts:ro
      - ./knowledge:/workspace/knowledge:ro
      - ./apps/studyassistant/data:/workspace/apps/studyassistant/data

  knowledge-service:
    build:
      context: ./services/knowledge
    container_name: preparaopos-knowledge-service
    ports:
      - "8100:8000"
    environment:
      SEARCH_SERVICE_URL: "http://embeddings:8000"
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3.1:latest"
      OLLAMA_READ_TIMEOUT_SECONDS: "900"
      PYTHONPATH: "/workspace/scripts:/app"
      KNOWLEDGE_DIR: "/workspace/knowledge"
      INDEX_OUTPUT_PATH: "/workspace/apps/studyassistant/data/knowledge_index.json"
      SCRIPTS_DIR: "/workspace/scripts"
    volumes:
      - ./knowledge:/workspace/knowledge
      - ./apps/studyassistant/data:/workspace/apps/studyassistant/data
      - ./scripts:/workspace/scripts
      - ./services/knowledge:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - embeddings

  db:
    image: mariadb:10.4
    container_name: preparaopos-preparadortai-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: preparadortai
      MARIADB_USER: preparaopos
      MARIADB_PASSWORD: preparaopos
    ports:
      - "3307:3306"
    volumes:
      - preparaopos_preparadortai_db_data:/var/lib/mysql
      - ./db/local:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5
    container_name: preparaopos-preparadortai-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: preparaopos
      PMA_PASSWORD: preparaopos
    ports:
      - "8081:80"
    depends_on:
      - db

  gateway:
    image: nginx:stable-alpine
    container_name: preparaopos-gateway
    ports:
      - "8080:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/gateway/50x.html:/usr/share/nginx/html/50x.html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  study-assistant:
    build:
      context: ./services/study-assistant
    container_name: preparaopos-study-assistant
    environment:
      - SA_HOST=0.0.0.0
      - SA_PORT=8095
      - LINKING_SERVICE_INTERNAL_URL=http://linking-service:8097
      - TEST_ENGINE_INTERNAL_URL=http://test-engine:8096
      - TEST_ENGINE_PUBLIC_URL=/tests
      - KNOWLEDGE_BASE_PATH=/workspace/knowledge
      - KNOWLEDGE_INDEX_PATH=/workspace/apps/studyassistant/data/knowledge_index.json
    volumes:
      - ./knowledge:/workspace/knowledge:ro
      - ./apps/studyassistant/data:/workspace/apps/studyassistant/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  test-engine:
    build:
      context: ./services/test-engine
    container_name: preparaopos-test-engine
    environment:
      - TE_HOST=0.0.0.0
      - TE_PORT=8096
      - ROOT_PATH=/tests
      - LINKING_SERVICE_INTERNAL_URL=http://linking-service:8097
      - STUDY_ASSISTANT_INTERNAL_URL=http://study-assistant:8095
      - STUDY_ASSISTANT_PUBLIC_URL=
      - TEST_ENGINE_SQLITE_PATH=/app/data/test_engine.sqlite
      - SQLITE_JOURNAL_MODE=DELETE
    volumes:
      - ./services/test-engine/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8096/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  linking-service:
    build:
      context: ./services/linking-service
    container_name: preparaopos-linking-service
    environment:
      - LS_HOST=0.0.0.0
      - LS_PORT=8097
      - APUNTES_SERVICE_INTERNAL_URL=http://study-assistant:8095
      - TEST_ENGINE_INTERNAL_URL=http://test-engine:8096
      - LINKING_SQLITE_PATH=/app/data/linking.sqlite
    volumes:
      - ./services/linking-service/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8097/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  preparaopos_preparadortai_db_data: