name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Los datos reales (BD de test-engine, apuntes sin revisar, índice de apuntes, imports/) no están
# en git. CI comprueba el código con lo que sí está versionado: los tests que necesitan esos datos
# se saltan y lo dicen en la salida (-rs); en local, con los datos, se ejecutan todos.

jobs:
  php-syntax:
    name: PHP syntax check (apps antiguas, hasta retirarlas)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          docker run --rm \
            -v "$PWD/apps/preparadortai:/app" \
            -w /app \
            php:8.2-cli \
            sh -c 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'

  python-tests:
    name: Python scripts tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Sin services/embeddings/requirements.txt: arrastraba sentence-transformers (torch) y
      # ningún test lo usa (los scripts lo importan solo al ejecutarse).
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -r services/knowledge/requirements.txt
          python -m spacy download es_core_news_sm

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify Knowledge Index build
        run: python scripts/build_knowledge_index.py

  service-tests:
    name: Service tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [study-assistant, test-engine, linking-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # la misma que sus Dockerfile

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q -rs

  gateway:
    name: Gateway and new services (docker compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # study-assistant monta el índice de apuntes, que no está en git: se genera con los
      # apuntes versionados.
      - name: Build knowledge index
        run: |
          pip install -r scripts/requirements.txt
          python scripts/build_knowledge_index.py

      - name: Start gateway, study-assistant, test-engine and linking-service
        run: docker compose up -d --build gateway study-assistant test-engine linking-service

      - name: Check routes through the gateway
        run: |
          check() {
            curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors \
              "http://localhost:8080$1" -o /tmp/body
            grep -q "$2" /tmp/body || { echo "$1 no contiene «$2»"; exit 1; }
            echo "OK $1"
          }
          check /healthz "OK"
          check / "Dashboard"
          check /tests/ "Test Engine"
          check /tests/static/style.css "scoreboard"
          check /static/css/styles.css "nested-toc"
          check /tests/generator/ "Generar"
          check /tests/history/ "Historial"
          check /ingest/ "pdf_file"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/tests)
          [ "$code" = "301" ] || { echo "/tests devolvió $code, se esperaba 301"; exit 1; }
          echo "OK /tests -> 301"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs gateway study-assistant test-engine linking-service

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
