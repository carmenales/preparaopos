name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          docker run --rm \
            -v "$PWD/apps/preparadortai:/app" \
            -w /app \
            php:8.2-cli \
            sh -c 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'

  docker-compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build web image
        run: docker compose build web

      - name: Start Docker stack
        run: docker compose up -d --build

      - name: Show Docker Compose services
        run: docker compose ps

      - name: Check static asset served by Apache
        run: curl --fail --silent --show-error http://localhost:8080/assets/css/style.css > /dev/null

      - name: Check StudyAssistant index
        run: curl --fail --silent --show-error http://localhost:8090/ > /dev/null

      - name: Check StudyAssistant note page
        run: |
          # Usa un ID real del índice; si no lo conoces, comprueba solo que la ruta responde 200 sin parámetros
          curl --fail --silent --show-error "http://localhost:8090/note.php?id=1" || \
          curl --fail --silent --show-error "http://localhost:8090/note.php" > /dev/null

      - name: Check thematic practice page
        run: curl --fail --silent --show-error "http://localhost:8080/practica_tematica.php?autosearch=1&topics[]=arquitectura" > /dev/null

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  python-tests:
    name: Python scripts tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify Knowledge Index build
        run: python scripts/build_knowledge_index.py