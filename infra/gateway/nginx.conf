events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolver DNS interno de Docker (127.0.0.11) para resolución dinámica
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Respetar políticas de no caché (Cache-Control: no-store)
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    server {
        listen 80;
        server_name localhost;

        # Cabeceras de proxy estándar para uvicorn (--proxy-headers)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Página de error amigable para degradación cuando un upstream esté caído
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Healthcheck propio del Gateway
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Redirección canónica de /tests a /tests/
        location = /tests {
            return 301 /tests/;
        }

        # Prefijo /tests/ hacia test-engine
        location /tests/ {
            set $te http://test-engine:8096;
            rewrite ^/tests/(.*)$ /$1 break;
            proxy_pass $te;
        }

        # Asistente de ingesta de study-assistant: admite PDF de hasta 50 MB (mismo límite
        # que valida la aplicación) y espera al refinado con Ollama en CPU, que puede tardar
        # minutos (study-assistant espera hasta 960 s a knowledge-service).
        location /ingest/ {
            set $sa http://study-assistant:8095;
            client_max_body_size 50m;
            proxy_read_timeout 1000s;
            proxy_send_timeout 1000s;
            proxy_pass $sa;
        }

        # Raíz / hacia study-assistant
        location / {
            set $sa http://study-assistant:8095;
            proxy_pass $sa;
        }
    }
}
